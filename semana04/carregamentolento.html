<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregamento Lento - Imagens Carregamento Lento</title>
    <meta name="description" content="Atividade de aprendizagem sobre carregamento lento de imagens com loanding nativo do navegador.">
    <meta name="author" content="Morone Ferreira">
    <link rel="stylesheet" href="estilos/carregamentolento.css">
    <script src="scripts/carregamentolento.js" defer></script>
</head>
<body>
    <header>
        <h1>Carregamento Lento de Imagens</h1>
    </header>

    <main>
        <h1>Imagens com Lazy Loading</h1>
        <img src="https://picsum.photos/400/600?random=1" alt="Paisagem aleatória 1" loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=2" alt="Paisagem aleatória 2" loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=3" alt="Paisagem aleatória 3" loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=4" alt="Paisagem aleatória 4" loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=5" alt="Paisagem aleatória 5" loading="lazy" width="400" height="600">
        <img src="https://picsum.photos/400/600?random=6" alt="Paisagem aleatória 6" loading="lazy" width="400" height="600">
    </main>

    <footer>
        <p>&copy; <span id="ano-atual"></span> 🌎 Morone Ferreira 🌎 Brasil</p>
        <p id="ultima-modificacao"></p>
    </footer>
    
</body>
</html>
